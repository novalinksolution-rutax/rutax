# CI: typecheck + lint + suite unitaria, y en paralelo el aislamiento RLS (pgTAP).
#
# Los dos jobs corren por separado a propósito:
# - `ci` es rápido y no necesita secretos: las pruebas Vitest son autocontenidas
#   (stubean su env, no tocan Supabase real).
# - `rls` levanta Supabase local en Docker, lo que tarda unos minutos. Vale la pena
#   igual: el aislamiento entre tenants es la regla no-negociable del proyecto y
#   una política rota no la detecta ningún test unitario.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias + cobertura (con piso/trinquete)
        run: npm run coverage

  rls:
    name: Aislamiento RLS (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Aplica supabase/migrations/* y el seed, igual que en local. Los tests de
      # supabase/tests/database/ se escriben contra ese mismo estado.
      - name: Levantar Supabase local
        run: supabase start

      - name: Pruebas de aislamiento (pgTAP)
        run: supabase test db

      - name: Apagar Supabase
        if: always()
        run: supabase stop
