  <title id="rutax-wordmark-titulo">Rutax</title>
  <!--
    Rutax — wordmark horizontal, monocromo, sin filete y sin fondo.
    Hereda `currentColor`, así que toma el color del contexto (sidebar, header,
    footer, tema claro y oscuro) sin necesidad de una segunda versión.
    Mismas letras que logo-rutax.svg; se le quita el filete porque a 24 px de
    alto quedaría por debajo de medio píxel.
  -->
