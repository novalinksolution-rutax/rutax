<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="rutax-logo-titulo">
  <title id="rutax-logo-titulo">Rutax</title>
  <!--
    Rutax — logotipo primario (v2, institucional). Dibujado a mano, no trazado.

    Grotesca a medida sobre em de 1000 unidades:
      cap height 700 · asta 92 · contracurva 94 (asta +2%, compensación óptica)
      tracking +55/1000 · filete 30 (1/3 de asta) a 180 bajo la línea base
      sobrepaso 7 (1%) en el fondo redondo de la U y en el ápice plano de la A

    El wordmark ocupa exactamente el 80% del ancho (x 100 → 900).
    Interletraje corregido a mano en R|U, T|A y A|X: ningún par de esta
    palabra es asta contra asta, así que el ritmo se igualó por área de
    blanco, no por distancia mínima.

    Tinta #172131 · acento navy de marca #2A3CA0 (solo el filete) · lienzo #FCFCFE.
    Sin degradados, sin sombras, sin trazo: solo relleno plano.
  -->
  <rect width="1000" height="1000" fill="#FCFCFE"/>
  <g transform="translate(100 352) scale(.3276)">
    <g fill="#172131" fill-rule="evenodd">
      <!-- R · asta + bowl (52,6% del cap) + pierna recta a 45,5° que nace bajo el bowl -->
      <path d="M0 0 L296 0 C394 0 440 125 440 184 C440 309 342 368 296 368 L130 368 L468 700 L337 700 L92 459 L92 700 L0 700 Z M92 92 L296 92 C330 92 346 155 346 184 C346 247 312 276 296 276 L92 276 Z"/>
      <!-- U · dos astas plenas y fondo simétrico con sobrepaso; no es una N rotada -->
      <path transform="translate(578 0)" d="M0 0 L0 480 C0 634 157 707 231 707 C305 707 462 553 462 480 L462 0 L370 0 L370 480 C370 570 276 613 231 613 C186 613 92 523 92 480 L92 0 Z"/>
      <!-- T · travesaño de ancho pleno, extremos cortados a escuadra -->
      <path transform="translate(1112 0)" d="M0 0 L440 0 L440 92 L266 92 L266 700 L174 700 L174 92 L0 92 Z"/>
      <!-- A · ápice plano recortado, diagonales a 16,4°, travesaño al 68% del cap -->
      <path transform="translate(1498 0)" d="M205 -4 L265 -4 L470 700 L370 700 L328 556 L134 556 L92 700 L0 700 Z M231 225 L305 478 L157 478 Z"/>
      <!-- X · diagonales a 24°, ángulo emparentado con el de la A pero deliberadamente distinto -->
      <path transform="translate(2030 0)" d="M0 0 L100 0 L206 238 L312 0 L412 0 L256 350 L412 700 L312 700 L206 462 L100 700 L0 700 L156 350 Z"/>
    </g>
    <!-- El filete: regla contable, ruta y subrayado. Único uso del navy de marca. -->
    <rect x="0" y="880" width="2442" height="30" fill="#2A3CA0"/>
  </g>
</svg>
