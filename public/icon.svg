<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="rutax-icono-titulo">
  <title id="rutax-icono-titulo">Rutax</title>
  <!--
    Rutax — ícono de app. Sirve favicon + PWA `any` + PWA `maskable` (manifest.ts).

    QUÉ REEMPLAZA
    ------------------------------------------------------------------------
    Un monograma «R» de la identidad ANTERIOR. La marca de hoy no es una letra:
    son DOS REGLAS QUE CALZAN, y de ese símbolo sale medio sistema de diseño
    («el producto separa con reglas, no con tarjetas ni sombras»).

    POR QUÉ NO NECESITA UNA VERSIÓN ESPECIAL A 16 px
    ------------------------------------------------------------------------
    Sin curvas y sin contraformas finas. A 16 px cada barra son 3 píxeles
    enteros y el aire otros 3 — el símbolo aguanta el favicon y la etiqueta
    térmica con el mismo dibujo. Un monograma de cinco letras no sobrevivía;
    esto sí.

    TINTA PLENA, Y ES DELIBERADO
    ------------------------------------------------------------------------
    Manual de marca, aplicaciones críticas: «ícono en tinta plena: la mancha
    más oscura de la pantalla de inicio. Se encuentra con guante y con sol».
    Por eso el fondo es la tinta y no el papel: en la pantalla de un teléfono
    lleno de íconos de colores, la mancha oscura es lo que lo hace encontrable
    a un conductor con guantes bajo el sol de las 16:00.

    ZONA SEGURA MASKABLE
    ------------------------------------------------------------------------
    El círculo seguro tiene radio 204,8 al centro. Con `translate(112,112)
    scale(12)` la caja del símbolo va de (124 · 172) a (388 · 340); su esquina
    más lejana queda a 156 del centro — dentro del círculo con holgura.
  -->
  <rect width="512" height="512" fill="#0B1114" />
  <g transform="translate(112,112) scale(12)">
    <!-- Barra superior: 15×5 desde el eje izquierdo. Papel. -->
    <rect x="1" y="5" width="15" height="5" fill="#E9F2F3" />
    <!-- Barra inferior: 15×5 desde el eje derecho. Acento.
         Se traslapan ocho unidades en el centro: ahí está el cuadre. -->
    <rect x="8" y="14" width="15" height="5" fill="#00D6B4" />
  </g>
</svg>
